[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inventra"
version = "2.1.0"
description = "An intelligent multi-agent system for inventory management, financial analysis, and business decision-making using LangGraph, Gemini AI, and weather forecasting."
readme = "README.md"
authors = [
    { name = "GenAI Live Course Team" }
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "langchain>=0.3.7",
    "langchain-google-genai>=2.0.10",
    "langgraph>=0.2.45",
    "langsmith>=0.2.0",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "requests==2.32.3",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.1",
    "streamlit==1.40.2",
    "python-dotenv==1.0.1",
    "mcp>=1.26.0",
    "httpx>=0.27.2",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.31",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0"
]

[project.scripts]
inventra = "main:main"

[tool.setuptools]
packages = ["database", "services", "agents", "tools", "config", "ui", "integrations"]
